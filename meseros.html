<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Meseros — La Bonga del Sinú</title>
<link rel="stylesheet" href="/src/styles/global.css">
<style>
  /* ============================================================
     RESET
     ============================================================ */
  *, *::before, *::after {
    box-sizing: border-box;
    min-width: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-light, #121212);
    color: var(--text-primary, #E0E0E0);
  }

  ui-category-tabs,
  ui-input,
  ui-product-card,
  ui-order-summary,
  ui-drawer {
    display: block;
    max-width: 100%;
    min-width: 0;
  }

  /* ============================================================
     LAYOUT PRINCIPAL
     ============================================================ */
  .mesero-app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  /* ---------- HEADER ---------- */
  .mesero-header {
    background: var(--color-primary, #E65100);
    color: #FFFFFF;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 4px rgba(0,0,0,.3);
    z-index: 10;
  }

  .mesero-header__brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1rem;
    flex: 1 1 auto;
    min-width: 0;
  }

  .mesero-header__brand span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mesero-header__mesa {
    background: rgba(255,255,255,.2);
    border: none;
    color: #FFFFFF;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
    white-space: nowrap;
  }

  .mesero-header__actions {
    display: flex;
    gap: 6px;
  }

  .mesero-header__actions button {
    background: rgba(255,255,255,.2);
    color: #FFFFFF;
    border: none;
    padding: 8px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    min-height: 40px;
    min-width: 40px;
  }

  .mesero-header__actions button:hover {
    background: rgba(255,255,255,.3);
  }

  /* ---------- CUERPO (2 COLUMNAS EN TABLET+) ---------- */
  .mesero-body {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 12px;
    padding: 12px;
    overflow: hidden;
    min-height: 0;
  }

  /* ---------- CATÁLOGO ---------- */
  .catalog-m {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    min-height: 0;
  }

  .catalog-m__tabs {
    background: var(--bg-surface, #1E1E1E);
    border-radius: 8px;
    padding: 6px;
  }

  .catalog-m__search {
    background: var(--bg-surface, #1E1E1E);
    border-radius: 8px;
    padding: 6px;
  }

  .catalog-m__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    overflow-y: auto;
    flex: 1;
    align-content: start;
    padding-right: 4px;
  }

  /* ---------- TARJETA COMPACTA DEL CATÁLOGO ---------- */
  .mesa-item {
    background: var(--bg-surface, #1E1E1E);
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    min-height: 76px;
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
    text-align: left;
  }

  .mesa-item:hover {
    border-color: var(--color-primary, #E65100);
    background: #242424;
  }

  .mesa-item__info {
    flex: 1;
    min-width: 0;
  }

  .mesa-item__name {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary, #E0E0E0);
    margin: 0 0 4px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mesa-item__price {
    font-size: 0.85rem;
    color: var(--color-secondary, #4CAF50);
    font-weight: 700;
  }

  .mesa-item__add {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    background: var(--color-primary, #E65100);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .mesa-item__add:hover {
    background: var(--color-primary-hover, #BF4500);
  }

  /* ---------- COLUMNA DERECHA: PEDIDO DE LA MESA ---------- */
  .mesa-order {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .mesa-order__title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--bg-surface, #1E1E1E);
    border-radius: 8px 8px 0 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }

  .mesa-order__title h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary, #E0E0E0);
  }

  .mesa-order__title small {
    font-size: 0.8rem;
    color: var(--text-secondary, #B0B0B0);
  }

  /* ---------- BOTÓN FLOTANTE (MÓVIL) ---------- */
  .floating-cart-m {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 30;
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--color-primary, #E65100);
    color: #FFFFFF;
    border: none;
    padding: 14px 20px;
    border-radius: 999px;
    min-height: 56px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,.4);
  }

  .floating-cart-m .badge {
    background: rgba(255, 255, 255, .25);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.9rem;
    min-width: 26px;
    text-align: center;
  }

  .floating-cart-m[hidden] { display: none !important; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */

  /* MÓVIL: una sola columna + botón flotante */
  @media (max-width: 899px) {
    .mesero-body {
      grid-template-columns: 1fr;
      padding: 10px;
    }
    .mesa-order {
      display: none;
    }
    .floating-cart-m {
      display: inline-flex;
    }
    .catalog-m {
      padding-bottom: 100px;
    }
  }

  /* TABLET+: dos columnas */
  @media (min-width: 900px) {
    .floating-cart-m {
      display: none;
    }
    .mesa-order {
      display: flex;
    }
  }

  /* Ajustes de header en móvil */
  @media (max-width: 480px) {
    .mesero-header__brand {
      font-size: 0.9rem;
    }
    .mesero-header__mesa {
      padding: 6px 10px;
      font-size: 0.8rem;
      min-height: 36px;
    }
    .mesero-header__actions button {
      padding: 6px 8px;
      font-size: 0.9rem;
      min-height: 36px;
      min-width: 36px;
    }
  }
</style>
</head>
<body>

<div class="mesero-app">

  <!-- HEADER -->
  <header class="mesero-header">
    <div class="mesero-header__brand">
      🍽️ <span>Mesero: Juan</span>
    </div>
    <button class="mesero-header__mesa" id="btnMesa">Mesa 3 ▾</button>
    <div class="mesero-header__actions">
      <button id="btnTheme" title="Modo claro/oscuro">☀️</button>
    </div>
  </header>

  <!-- CUERPO -->
  <div class="mesero-body">

    <!-- CATÁLOGO -->
    <section class="catalog-m">
      <div class="catalog-m__tabs">
        <ui-category-tabs id="meseroTabs" active="all"></ui-category-tabs>
      </div>
      <div class="catalog-m__search">
        <ui-input id="meseroSearch" placeholder="Buscar platillo..." type="search"></ui-input>
      </div>
      <div class="catalog-m__grid" id="meseroCatalog"></div>
    </section>

    <!-- PEDIDO DE LA MESA (visible en tablet+) -->
    <aside class="mesa-order">
      <div class="mesa-order__title">
        <h2 id="mesaTitle">Mesa 3</h2>
        <small id="mesaCount">0 items</small>
      </div>
      <ui-order-summary id="mesaSummary"></ui-order-summary>
    </aside>

  </div>

</div>

<!-- Botón flotante (solo móvil) -->
<button class="floating-cart-m" id="floatingCartM" hidden>
  🛒 Ver pedido <span class="badge" id="floatingCartCountM">0</span>
</button>

<!-- Drawer para móvil -->
<ui-drawer id="cartDrawerM">
  <span slot="title">Mesa 3</span>
  <ui-order-summary id="drawerSummaryM"></ui-order-summary>
</ui-drawer>

<script type="module" src="/src/meseros.js"></script>

</body>
</html>
