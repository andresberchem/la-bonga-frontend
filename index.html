<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E65100">
<title>La Bonga del Sinú — Pedidos en línea</title>
<link rel="stylesheet" href="./src/styles/global.css">
<style>
  /* ============================================================
     RESET Y REGLAS BASE
     ============================================================ */
  *, *::before, *::after {
    box-sizing: border-box;
    min-width: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  ui-category-tabs,
  ui-input,
  ui-product-card,
  ui-order-summary,
  ui-drawer {
    display: block;
    max-width: 100%;
    min-width: 0;
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .app-header {
    background: var(--color-primary, #E65100);
    color: #FFFFFF;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    width: 100%;
  }

  .app-header h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1 1 auto;
  }

  .app-header button {
    flex: 0 0 auto;
    background: rgba(255, 255, 255, .2);
    color: #FFFFFF;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    white-space: nowrap;
    min-height: 40px;
  }

  .app-header button:hover {
    background: rgba(255, 255, 255, .3);
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    padding: 24px;
    max-width: 1280px;
    margin: 0 auto;
    align-items: start;
  }

  .menu h2 { margin-top: 0; }
  .menu { padding-bottom: 100px; }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .summary-panel {
    position: sticky;
    top: 80px;
  }

  /* ============================================================
     BOTÓN FLOTANTE DEL CARRITO
     ============================================================ */
  .floating-cart {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 30;
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--color-primary, #E65100);
    color: #FFFFFF;
    border: none;
    padding: 12px 20px;
    border-radius: 999px;
    min-height: 48px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.2);
  }

  .floating-cart .badge {
    background: rgba(255, 255, 255, .25);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.8rem;
    min-width: 22px;
    text-align: center;
  }

  .floating-cart[hidden] { display: none !important; }

  /* ============================================================
     RESPONSIVE - MÓVIL (< 600px)
     1 columna de cards
     ============================================================ */
  @media (max-width: 599px) {
    .app-header {
      padding: 10px 12px;
      gap: 8px;
    }
    .app-header h1 {
      font-size: 1rem;
    }
    .app-header button {
      padding: 6px 10px;
      font-size: 0.72rem;
      min-height: 36px;
    }
    .layout {
      grid-template-columns: 1fr;
      padding: 16px;
    }
    .menu-grid {
      grid-template-columns: 1fr !important;
    }
    .summary-panel { display: none; }
    .floating-cart { display: inline-flex; }
  }

  /* ============================================================
     RESPONSIVE - TABLET (600px a 1023px)
     2 columnas de cards
     ============================================================ */
  @media (min-width: 600px) and (max-width: 1023px) {
    .layout {
      grid-template-columns: 1fr;
      padding: 20px;
    }
    .menu-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
    .summary-panel { display: none; }
    .floating-cart { display: inline-flex; }
  }

  /* ============================================================
     RESPONSIVE - DESKTOP (>= 1024px)
     Menú + resumen lateral
     ============================================================ */
  @media (min-width: 1024px) {
    .menu { padding-bottom: 0; }
    .floating-cart { display: none; }
    .summary-panel { display: block; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1 id="appTitle">🍽️ La Bonga del Sinú</h1>
  <button id="themeToggle">🌙 Modo oscuro</button>
</header>

<main class="layout">
  <section class="menu">
    <h2>Menú</h2>
    <div style="margin-bottom: 16px;">
      <ui-category-tabs id="categoryTabs" active="all"></ui-category-tabs>
    </div>
    <div style="margin-bottom: 16px;">
      <ui-input id="menuSearch" placeholder="Buscar platillo..." type="search"></ui-input>
    </div>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <aside class="summary-panel">
    <ui-order-summary id="summaryDesktop"></ui-order-summary>
  </aside>
</main>

<button class="floating-cart" id="floatingCart">
  🛒 Ver pedido <span class="badge" id="floatingCartCount">0</span>
</button>

<ui-drawer id="cartDrawer">
  <span slot="title">Tu Pedido</span>
  <ui-order-summary id="summaryDrawer"></ui-order-summary>
</ui-drawer>

<script type="module" src="./src/app.js"></script>

</body>
</html>
