<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Bonga del Sinú — Pedidos en línea</title>

  <link rel="stylesheet" href="/src/styles/global.css" />

  <style>
    .app-header {
      background: var(--color-primary);
      color: var(--text-inverse);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: var(--shadow-sm);
    }

    .app-header h1 {
      margin: 0;
      font-size: var(--font-size-h3);
    }

    .app-header button {
      background: rgba(255, 255, 255, .2);
      color: var(--text-inverse);
      border: none;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      cursor: pointer;
      min-height: var(--touch-target-min);
      font-family: inherit;
      font-size: var(--font-size-label);
    }

    .app-header button:hover {
      background: rgba(255, 255, 255, .3);
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--space-lg);
      padding: var(--space-lg);
      max-width: 1280px;
      margin: 0 auto;
      align-items: start;
    }

    .menu h2 { margin-top: 0; }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-md);
    }

    .summary-panel {
      position: sticky;
      top: 80px;
    }

    /* ---- Botón flotante del carrito (solo móvil/tablet) ---- */
    .floating-cart {
      position: fixed;
      bottom: var(--space-lg);
      right: var(--space-lg);
      z-index: 30;
      display: none;
      align-items: center;
      gap: var(--space-sm);
      background: var(--color-primary);
      color: var(--text-inverse);
      border: none;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-pill);
      min-height: var(--touch-target-min);
      font-family: inherit;
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-bold);
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .floating-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(230, 81, 0, .35);
    }

    .floating-cart .badge {
      background: rgba(255, 255, 255, .25);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: var(--font-size-label);
      min-width: 24px;
      text-align: center;
    }

    .floating-cart[hidden] {
      display: none;
    }

    /* ---- Responsive ---- */
    @media (max-width: 1023px) {
      .layout {
        grid-template-columns: 1fr;
        padding: var(--space-md);
      }

      .summary-panel {
        display: none;
      }

      .floating-cart {
        display: inline-flex;
      }
    }

    /* ---- Drawer container ---- */
    #cartDrawer {
      /* El propio drawer maneja su visibilidad */
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>🍽️ La Bonga del Sinú</h1>
    <button id="themeToggle">🌙 Modo oscuro</button>
  </header>

  <main class="layout">
    <section class="menu">
      <h2>Menú</h2>
      <div style="margin-bottom: var(--space-md);">
        <ui-category-tabs id="categoryTabs" active="all"></ui-category-tabs>
      </div>
      <div style="margin-bottom: var(--space-md);">
        <ui-input id="menuSearch" placeholder="Buscar platillo..." type="search"></ui-input>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <!-- Panel lateral (solo desktop) -->
    <aside class="summary-panel">
      <ui-order-summary id="summaryDesktop"></ui-order-summary>
    </aside>
  </main>

  <!-- Botón flotante del carrito (solo móvil/tablet) -->
  <button class="floating-cart" id="floatingCart">
    🛒 Ver pedido <span class="badge" id="floatingCartCount">0</span>
  </button>

  <!-- Drawer para móvil/tablet -->
  <ui-drawer id="cartDrawer">
    <span slot="title">Tu Pedido</span>
    <ui-order-summary id="summaryDrawer"></ui-order-summary>
  </ui-drawer>

  <script type="module" src="/src/app.js"></script>

</body>
</html>
