<!DOCTYPE html>

<style>*,:before,:after{box-sizing:border-box;min-width:0}html,body{width:100%;max-width:100%;margin:0;padding:0;overflow-x:hidden}ui-category-tabs,ui-input,ui-product-card,ui-order-summary,ui-drawer{min-width:0;max-width:100%;display:block}.app-header{background:var(--color-primary,#e65100);color:#fff;z-index:20;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 16px;display:flex;position:sticky;top:0;box-shadow:0 1px 3px #0000001f}.app-header h1{white-space:nowrap;text-overflow:ellipsis;flex:auto;min-width:0;margin:0;font-size:1.1rem;font-weight:700;line-height:1.2;overflow:hidden}.app-header button{color:#fff;cursor:pointer;white-space:nowrap;background:#fff3;border:none;border-radius:8px;flex:none;min-height:40px;padding:8px 14px;font-family:inherit;font-size:.8rem;font-weight:500}.app-header button:hover{background:#ffffff4d}.layout{grid-template-columns:2fr 1fr;align-items:start;gap:24px;max-width:1280px;margin:0 auto;padding:24px;display:grid}.menu h2{margin-top:0}.menu{padding-bottom:100px}.menu-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;display:grid}.summary-panel{position:sticky;top:80px}.floating-cart{z-index:30;background:var(--color-primary,#e65100);color:#fff;cursor:pointer;border:none;border-radius:999px;align-items:center;gap:8px;min-height:48px;padding:12px 20px;font-family:inherit;font-size:.95rem;font-weight:700;display:none;position:fixed;bottom:20px;right:20px;box-shadow:0 4px 8px #0003}.floating-cart .badge{text-align:center;background:#ffffff40;border-radius:999px;min-width:22px;padding:2px 8px;font-size:.8rem}.floating-cart[hidden]{display:none!important}@media (width<=599px){.app-header{gap:8px;padding:10px 12px}.app-header h1{font-size:1rem}.app-header button{min-height:36px;padding:6px 10px;font-size:.72rem}.layout{grid-template-columns:1fr;padding:16px}.menu-grid{grid-template-columns:1fr!important}.summary-panel{display:none}.floating-cart{display:inline-flex}}@media (width>=600px) and (width<=1023px){.layout{grid-template-columns:1fr;padding:20px}.menu-grid{grid-template-columns:repeat(2,1fr)!important}.summary-panel{display:none}.floating-cart{display:inline-flex}}@media (width>=1024px){.menu{padding-bottom:0}.floating-cart{display:none}.summary-panel{display:block}}</style>
  <script type="module" crossorigin src="./assets/main-BF_MY1Xo.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/ui-button-BUPy334S.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-drawer-e-olNJtB.js">
  <link rel="stylesheet" crossorigin href="./assets/ui-button-CDlhTRhd.css">

<body>

<header class="app-header">
  <h1 id="appTitle">🍽️ La Bonga del Sinú</h1>
  <button id="themeToggle">🌙 Modo oscuro</button>
</header>

<main class="layout">
  <section class="menu">
    <h2>Menú</h2>
    <div style="margin-bottom: 16px;">
      <ui-category-tabs id="categoryTabs" active="all"></ui-category-tabs>
    </div>
    <div style="margin-bottom: 16px;">
      <ui-input id="menuSearch" placeholder="Buscar platillo..." type="search"></ui-input>
    </div>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <aside class="summary-panel">
    <ui-order-summary id="summaryDesktop"></ui-order-summary>
  </aside>
</main>

<button class="floating-cart" id="floatingCart">
  🛒 Ver pedido <span class="badge" id="floatingCartCount">0</span>
</button>

<ui-drawer id="cartDrawer">
  <span slot="title">Tu Pedido</span>
  <ui-order-summary id="summaryDrawer"></ui-order-summary>
</ui-drawer>


</body>
</html>
