<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS — La Bonga del Sinú</title>
<style>*,:before,:after{box-sizing:border-box;min-width:0}html,body{width:100%;max-width:100%;height:100%;margin:0;padding:0;overflow:hidden}.pos-app{grid-template-rows:60px 1fr;height:100vh;display:grid}.pos-header{background:var(--color-primary,#e65100);color:#fff;justify-content:space-between;align-items:center;gap:16px;padding:0 20px;display:flex;box-shadow:0 2px 4px #00000026}.pos-header__brand{align-items:center;gap:12px;font-size:1.1rem;font-weight:700;display:flex}.pos-header__brand small{opacity:.7;border-left:1px solid #ffffff4d;padding-left:12px;font-size:.75rem;font-weight:400}.pos-header__actions{align-items:center;gap:12px;display:flex}.pos-header__cajero{background:#ffffff26;border-radius:6px;padding:6px 12px;font-size:.85rem}.pos-header__actions button{color:#fff;cursor:pointer;background:#fff3;border:none;border-radius:6px;min-height:40px;padding:8px 14px;font-family:inherit;font-size:.85rem;font-weight:500}.pos-header__actions button:hover{background:#ffffff4d}.pos-body{background:#f5f5f5;grid-template-columns:1fr 480px;gap:16px;padding:16px;display:grid;overflow:hidden}.catalog{flex-direction:column;gap:12px;min-width:0;display:flex;overflow:hidden}.catalog__search,.catalog__tabs{background:#fff;border-radius:8px;padding:8px;box-shadow:0 1px 3px #00000014}.catalog__grid{flex:1;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));align-content:start;gap:8px;padding-right:4px;display:grid;overflow-y:auto}.pos-item{cursor:pointer;text-align:left;background:#fff;border:1px solid #0000;border-radius:8px;justify-content:space-between;align-items:center;gap:8px;min-height:64px;padding:12px;transition:border-color .15s,box-shadow .15s;display:flex}.pos-item:hover{border-color:var(--color-primary,#e65100);box-shadow:0 2px 6px #e6510026}.pos-item__info{flex:1;min-width:0}.pos-item__name{color:var(--text-primary,#212121);white-space:nowrap;text-overflow:ellipsis;margin:0 0 4px;font-size:.9rem;font-weight:600;overflow:hidden}.pos-item__price{color:var(--color-secondary,#2e7d32);font-size:.8rem;font-weight:700}.pos-item__add{background:var(--color-primary,#e65100);color:#fff;cursor:pointer;border:none;border-radius:6px;flex-shrink:0;justify-content:center;align-items:center;width:36px;height:36px;font-size:1.2rem;font-weight:700;line-height:1;display:inline-flex}.pos-item__add:hover{background:var(--color-primary-hover,#bf4500)}.order{flex-direction:column;display:flex;overflow:hidden}.order ui-pos-table{flex-direction:column;flex:1;display:flex;overflow:hidden}@media (width<=1023px){html,body{height:auto;overflow:auto}.pos-app{grid-template-rows:auto 1fr;height:auto;min-height:100vh}.pos-header{flex-wrap:wrap;min-height:60px;padding:12px 16px}.pos-body{grid-template-columns:1fr;overflow:visible}.catalog{overflow:visible}.catalog__grid,.order ui-pos-table{max-height:none;overflow:visible}}</style>
  <script type="module" crossorigin src="./assets/pos-Di8z-Ydv.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/ui-button-BUPy334S.js">
  <link rel="stylesheet" crossorigin href="./assets/ui-button-CDlhTRhd.css">
</head>
<body>

<div class="pos-app">

  <!-- HEADER -->
  <header class="pos-header">
    <div class="pos-header__brand">
      🍽️ La Bonga del Sinú
      <small>Punto de Venta</small>
    </div>
    <div class="pos-header__actions">
      <span class="pos-header__cajero">Cajero: Andrés</span>
      <button id="btnCerrar">Cerrar caja</button>
    </div>
  </header>

  <!-- CUERPO -->
  <div class="pos-body">

    <!-- COLUMNA IZQUIERDA: CATÁLOGO -->
    <section class="catalog">
      <div class="catalog__tabs">
        <ui-category-tabs id="posTabs" active="all"></ui-category-tabs>
      </div>
      <div class="catalog__search">
        <ui-input id="posSearch" placeholder="Buscar producto..." type="search"></ui-input>
      </div>
      <div class="catalog__grid" id="posCatalog"></div>
    </section>

    <!-- COLUMNA DERECHA: PEDIDO -->
    <aside class="order">
      <ui-pos-table id="posTable"></ui-pos-table>
    </aside>

  </div>

</div>


</body>
</html>
